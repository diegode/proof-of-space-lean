version: "v0.4"
project:
  name: "Block depth robustness of DRSample and BucketSample"
  description: >-
    Exponent-dependent block-depth robustness for the exact independent DRSample
    and BucketSample distributions, the sampler-avoidance lemma with any fixed
    product fraction beta < 1, and the two deterministic appendix lemmas.
    The deletion budget is Theta(epsilon n/L(n)), surviving depth is
    Omega(n/(log_2 n)^epsilon), and block width is Theta(L(n)/epsilon), for
    every fixed 0 < epsilon < 1 and all sufficiently large n.
    Five of eleven labeled paper results are proved; full-paper coverage remains
    unfinished, as recorded in README.md.
  authors: ["Diego de Estrada (@diegode)"]
  responsible_maintainers: ["Diego de Estrada (@diegode)"]
  license: "Apache-2.0"
classification:
  arxiv: ["cs.CR", "math.CO"]
  msc2020: ["94A60", "05C80", "68Q25"]
sources:
  - title: "Data-Independent Memory Hard Functions: New Attacks and Stronger Constructions"
    authors: ["Jeremiah Blocki", "Benjamin Harsha", "Siteng Kang", "Seunghoon Lee", "Lu Xing", "Samson Zhou"]
    type: "paper"
    id: "https://eprint.iacr.org/2018/944"
    location: "CRYPTO 2019; Conjecture 2 in Appendix F of the full version"
    relationship: "adapts"
    note: >-
      Proves the current exponent-dependent block-depth-robustness regime for the
      independent sampler and integer rounding in Challenge.lean.
    author_endorsement: "not-contacted"
  - title: "Practical Graphs for Optimal Side-Channel Resistant Memory-Hard Functions"
    authors: ["Joel Alwen", "Jeremiah Blocki", "Ben Harsha"]
    type: "paper"
    id: "https://doi.org/10.1145/3133956.3134031"
    relationship: "background"
    note: >-
      Source of DRSample and the restricted metagraph construction. Claim 2 gives
      the good-vertex estimate, attributed there to Erdos, Graham, and Szemeredi;
      the proof development generalizes the density estimate to every fixed
      deletion fraction below one.
    author_endorsement: "not-contacted"
  - title: "Randomized Search Trees"
    authors: ["Raimund Seidel", "Cecilia R. Aragon"]
    type: "paper"
    id: "https://doi.org/10.1007/BF01940876"
    relationship: "background"
    note: "The treap ancestor probability is classical; the increasing-subsequence bound is proved in the development."
    author_endorsement: "not-contacted"
related_formalizations: []
status:
  scope: >-
    Five registered statements from the current paper have complete proofs.
    The full-paper request is unfinished: BRG pebbling optimality, block-to-fractional
    conversion, the two-sided fractional corollary, Valiant's depth reduction,
    balanced optimality, and the general conditional-label multiscale theorem
    remain unproved. Supporting results prove arbitrary-fraction graph multiscale
    bounds, block lifting, parameter selection with eb >= beta n, and the width
    obstruction. No unproved paper result is assumed in the completed proofs.

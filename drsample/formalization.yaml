version: "v0.4"
project:
  name: "Block depth robustness of DRSample, BucketSample, and HarmonicSample"
  description: >-
    Explicit block-depth-robustness theorems for the exact independent DRSample,
    BucketSample(n,r), and HarmonicSample(n,r) distributions, for every n >= 2^120
    and every integer r >= 1. With L(n)=log_2 n/log_2 log_2 n, all three have
    e=floor(n/(18000 L(n))), b=floor(3600 L(n)), and failure at most
    exp(-n/(11000 L(n))). The depth is 1.48 n/L(n) for DRSample and BucketSample
    and 2 n/L(n) for HarmonicSample. The proof establishes the two-thirds
    exponential moment, the improved multiscale bound, triangular port geometry,
    averaging over shifted block partitions, and the numerical cutoff.
  authors: ["Diego de Estrada (@diegode)"]
  responsible_maintainers: ["Diego de Estrada (@diegode)"]
  license: "Apache-2.0"
classification:
  arxiv: ["cs.CR", "math.CO"]
  msc2020: ["94A60", "05C80", "68Q25"]
sources:

    authors: ["Jeremiah Blocki", "Benjamin Harsha", "Siteng Kang", "Seunghoon Lee", "Lu Xing", "Samson Zhou"]
    type: "paper"
    id: "https://eprint.iacr.org/2018/944"
    location: "CRYPTO 2019; Conjecture 2 in Appendix F of the full version"
    relationship: "adapts"
    note: >-
      Proves the current exponent-dependent block-depth-robustness regime for the
      independent sampler and integer rounding in Challenge.lean.
    author_endorsement: "not-contacted"
  - title: "Practical Graphs for Optimal Side-Channel Resistant Memory-Hard Functions"
    authors: ["Joel Alwen", "Jeremiah Blocki", "Ben Harsha"]
    type: "paper"
    id: "https://doi.org/10.1145/3133956.3134031"
    relationship: "background"
    note: >-
      Source of DRSample and the restricted metagraph construction. Claim 2 gives
      the good-vertex estimate, attributed there to Erdos, Graham, and Szemeredi;
      the proof development generalizes the density estimate to every fixed
      deletion fraction below one. Lemma 2.2 supplies the binary edge-class
      depth-reduction construction, checked in local Zotero item A3LAU3M7,
      attachment 2M8AVSYF.
    author_endorsement: "not-contacted"
  - title: "On the Depth-Robustness and Cumulative Pebbling Cost of Argon2i"
    authors: ["Jeremiah Blocki", "Samson Zhou"]
    type: "paper"
    id: "https://doi.org/10.1007/978-3-319-70500-2_15"
    location: "TCC 2017; Theorem 4"
    relationship: "adapts"
    note: >-
      The block-to-fractional conversion is proved with integer deletion budgets
      and truncated boundary blocks. The source was checked in local Zotero item
      JLUWR5RH, attachment PMHMDREK. Graph reversal gives two-sided guarantees.
    author_endorsement: "not-contacted"
  - title: "Randomized Search Trees"
    authors: ["Raimund Seidel", "Cecilia R. Aragon"]
    type: "paper"
    id: "https://doi.org/10.1007/BF01940876"
    relationship: "background"
    note: "The treap ancestor probability is classical; the increasing-subsequence bound is proved in the development."
    author_endorsement: "not-contacted"

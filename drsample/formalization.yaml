      lean: "ProofOfSpaceStatement.drsample_conjecture2"
      module: "Solution"
      status: "proved with the paper's explicit constants and exact independent sampler"
    - source: "paper/finalnew/sections/robustness.tex, cor:bucket-optimal"
      lean: "ProofOfSpaceStatement.bucketSample_block_robustness"
      module: "Solution"
      status: "proved with the paper's explicit constants and exact independent sampler"

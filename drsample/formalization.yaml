version: "v0.4"
project:
  name: "Block depth robustness of DRSample and BucketSample"
  description: >-
    Explicit block-depth-robustness theorems for the exact independent DRSample
    and BucketSample(n,r) distributions, for every n >= 2^120 and every integer
    r >= 1. With L(n)=log_2 n/log_2 log_2 n, both have
    e=floor(n/(18000 L(n))), b=floor(3600 L(n)), and failure at most
    exp(-n/(11000 L(n))). The depth is 1.48 n/L(n). Both sampler proofs apply
    the paper's common avoidance lemma. The proof establishes the two-thirds
    exponential moment, the improved multiscale bound, triangular port geometry,
    averaging over shifted block partitions, and the numerical cutoff.
  authors: ["Diego de Estrada (@diegode)"]
  responsible_maintainers: ["Diego de Estrada (@diegode)"]
  license: "Apache-2.0"
classification:
  arxiv: ["cs.CR", "math.CO"]
  msc2020: ["94A60", "05C80", "68Q25"]
sources:
  - title: "Data-Independent Memory Hard Functions: New Attacks and Stronger Constructions"
    authors: ["Jeremiah Blocki", "Benjamin Harsha", "Siteng Kang", "Seunghoon Lee", "Lu Xing", "Samson Zhou"]
    type: "paper"
    id: "https://eprint.iacr.org/2018/944"
    location: "CRYPTO 2019; Conjecture 2 in Appendix F of the full version"
    relationship: "adapts"
    note: >-
      Proves the stated conjectural block-depth-robustness regime, with explicit
      constants, for the independent sampler and integer rounding in Challenge.lean.
    author_endorsement: "not-contacted"
  - title: "Practical Graphs for Optimal Side-Channel Resistant Memory-Hard Functions"
    authors: ["Joel Alwen", "Jeremiah Blocki", "Ben Harsha"]
    type: "paper"
    id: "https://doi.org/10.1145/3133956.3134031"
    relationship: "background"
    note: >-
      Source of DRSample and the restricted metagraph construction. Claim 2 gives
      the good-vertex estimate, attributed there to Erdos, Graham, and Szemeredi;
      the proof development proves its required four-fifths density instance.
    author_endorsement: "not-contacted"
  - title: "Randomized Search Trees"
    authors: ["Raimund Seidel", "Cecilia R. Aragon"]
    type: "paper"
    id: "https://doi.org/10.1007/BF01940876"
    relationship: "background"
    note: "The treap ancestor probability is classical; the increasing-subsequence bound is proved in the development."
    author_endorsement: "not-contacted"
related_formalizations: []
status:
  scope: >-
    One registered exact-sampler statement: drsample_conjecture2.
    Solution.lean also proves bucketSample_block_robustness for every r >= 1.
    Supporting results include normalization, reciprocal-distance avoidance,
    the multiscale depth bound, triangular path lifting, shift averaging, and all explicit
    numerical estimates. The paper's cited pebbling optimality and fractional
    robustness reductions, and its general conditional-label multiscale theorem,
    are outside the public theorem scope. The required graph specialization of
    the multiscale theorem is proved.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "ProofOfSpaceStatement.drsample_conjecture2"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "ProofOfSpaceStatement.bucketSample_block_robustness"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
automation:
  methods:
    - method: "agent"
      models: ["OpenAI Codex"]
      framework: "Codex"
      tool_setup: >-
        Human-directed mathematical and Lean development, literature checking,
        constant optimization, elaboration diagnostics, and packaging. Lean,
        Comparator, and NanoDa are used for proof verification.
      prompting_notes: "The human supplied the mathematical task, source proof, target parameters, and packaging requirements."
  notes: "Exact costs and wall times were not tracked; no prompt transcript is included."
fidelity:
  divergences: >-
    The statements specify the paper's exact finite independent distributions,
    including capped buckets, upward rounding for DRSample, downward rounding
    and the shared fine position for BucketSample. Path lengths count vertices.
    Both proofs lift paths directly through block centers. Lean specializes the
    half-block size to s = 10 ceil(116 L(n)), whereas the paper uses
    s = ceil(1160 L(n)); both lie between 1160 L(n) and 1161 L(n). Lean's
    integral port condition is slightly stricter and ensures a gain of 9s/10.
    The displayed sampler parameters and cutoff agree.
review:
  status: "self-assessed"
  notes: >-
    Lean checks both sampler proofs. The configured Comparator and NanoDa
    kernels check the sole Challenge theorem, drsample_conjecture2.
    These checks establish proof validity and statement agreement;
    no independent human mathematical review is claimed.
alignment:
  namespace: "ProofOfSpaceStatement"
  statements:

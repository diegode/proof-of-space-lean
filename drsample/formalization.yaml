version: "v0.4"
project:
  name: "Block and fractional depth robustness of DRSample and BucketSample"
  description: >-
    Exponent-dependent block-depth robustness for the exact independent DRSample
    and BucketSample distributions, the sampler-avoidance lemma with any fixed
    product fraction beta < 1, the two deterministic appendix lemmas, and
    block-to-fractional conversion with two-sided fractional bounds for both samplers,
    Valiant depth reduction, balanced optimality, and the general conditional-label
    multiscale theorem.
    The deletion budget is Theta(epsilon n/L(n)), surviving depth is
    Omega(n/(log_2 n)^epsilon), and block width is Theta(L(n)/epsilon), for
    every fixed 0 < epsilon < 1 and all sufficiently large n.
    All ten required labeled paper results are proved; the cited BRG pebbling
    corollary is outside scope, as recorded in README.md.
  authors: ["Diego de Estrada (@diegode)"]
  responsible_maintainers: ["Diego de Estrada (@diegode)"]
  license: "Apache-2.0"
classification:
  arxiv: ["cs.CR", "math.CO"]
  msc2020: ["94A60", "05C80", "68Q25"]

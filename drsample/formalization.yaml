fidelity:
  divergences: >-
    The distribution uses independent uniform bucket and distance choices.
    The statement includes capped overlapping buckets and upward rounding and
    measures path length in vertices. A theorem in the proof library identifies
    this direct per-vertex distribution with the grouped distribution used by
    the multiscale proof. The ceiling bucket count removes one repeated capped
    bucket at vertices where v+1 is a power of two, compared with the original
    floor-plus-one convention. The numerical cutoff n >= 2^120 is certified;
    a fixed pseudorandom seed or machine-word implementation is not.

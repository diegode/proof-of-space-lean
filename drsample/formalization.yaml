    Eleven registered statements cover all ten required labeled results from the
    current paper. Supporting results prove arbitrary-fraction graph multiscale
    bounds, block lifting, parameter selection with eb >= beta n, and asymptotic
    domination of the samplers' deletion budgets by their certified depths.
    The general multiscale theorem allows unbounded dependent integer labels.
    The cited BRG pebbling corollary is out of scope and is not used.
    No unproved paper result is assumed in the proofs.

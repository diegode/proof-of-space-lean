fidelity:
  divergences: >-
    The exact independent sampler distributions, integer rounding, vertex-count
    path lengths, and adversarial deletion events are preserved. Public sampler
    statements now quantify over every exponent between zero and one, using
    positive constants to witness the paper's orders. Their thresholds may depend
    on the exponent. The general avoidance constants depend only on beta.
    Fractional constants depend only on f < 1/2. A residue-class cover replaces
    the greedy procedure in Blocki--Zhou Theorem 4, accounts for truncated blocks,
    and proves both directions by reversing the same sampled graph.
    The proof retains integer blocks of size 20a and the existing triangular port
    geometry, with a proportional to L(n)/epsilon. The density threshold in the
    label proof is (q-1)/q for a suitable q depending on alpha; these internal
    choices differ from the appendix but yield its stated bounds. Valiant's bound
    uses binary edge classes. Balanced reduction uses k = ceil(log_2 ceil(log_2 n))
    instead of ceil(log_2 L(n)), yielding the same asymptotic order. The conditional
    label theorem uses a PMF on the joint array of all labels and states positivity
    on its support; its failure exponent is explicitly 2 - log(3).

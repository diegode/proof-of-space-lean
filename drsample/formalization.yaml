automation:
  methods:
    - method: "agent"
      models: ["OpenAI Codex"]
      framework: "Codex"
      tool_setup: >-
        Human-directed mathematical and Lean development, literature checking,
        constant optimization, elaboration diagnostics, and packaging. Lean,
        Comparator, and NanoDa are used for proof verification.
      prompting_notes: "The human supplied the mathematical task, source proof, target parameters, and packaging requirements."
  notes: "Exact costs and wall times were not tracked; no prompt transcript is included."
fidelity:
  divergences: >-
    The exact independent sampler distributions, integer rounding, vertex-count
    path lengths, and adversarial deletion events are preserved. Public sampler
    statements now quantify over every exponent between zero and one, using
    positive constants to witness the paper's orders. Their thresholds may depend
    on the exponent. The general avoidance constants depend only on beta.
    The proof retains integer blocks of size 20a and the existing triangular port
    geometry, with a proportional to L(n)/epsilon. The density threshold in the
    label proof is (q-1)/q for a suitable q depending on alpha; these internal
    choices differ from the appendix but yield its stated bounds.
review:
  status: "self-assessed"
  notes: >-
    Lean checks the five completed results and their supporting proofs.
    Comparator verified agreement for all five statements, and both NanoDa and
    the Lean default kernel accepted their exported proofs.
    No independent human mathematical review is claimed. The six missing paper
    results are recorded explicitly in README.md and are not theorem placeholders
    in Solution or supporting proof modules.

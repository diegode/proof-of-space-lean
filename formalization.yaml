# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Formalized latency bounds for stacked proofs of space"
  description: >-
    A Lean 4 formalization of the static latency argument for stacked
    proof-of-space graphs. A degree-eight Chung interlayer is sampled as eight
    uniform permutations and reused throughout the stack. Under explicit
    intra-layer depth robustness and pebbling-budget hypotheses, every
    sufficiently large red-free challenge footprint contains, with an exact
    quantified failure bound, an unpebbled directed path of length
    Omega(ell*n). All constants are explicit, and the finite-size
    Filecoin-shaped analysis certifies an asymptotic coefficient between
    0.02135 and 0.02136.
  authors:
    - "Diego de Estrada (@diegode)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Diego de Estrada (@diegode)"

classification:
  arxiv: ["cs.CR"]
  msc2020: ["94A60", "68Q25"]

sources:
  - title: "Proofs of space with maximal hardness"
    authors: ["Leonid Reyzin"]
    type: "conference paper"
    id: "https://dblp.org/rec/conf/focs/Reyzin24"
    location: "65th IEEE Symposium on Foundations of Computer Science, 2024, pages 1159-1177"
    relationship: "adapts"
    note: >-
      The formalization uses Reyzin's footprint recurrence, expansion
      profile, and chain-growth framework. Its theorem permits continuation
      chains to break and restart and supplies a global ledger and path
      witness.
    author_endorsement: "not-contacted"
  - title: "Tight proofs of space and replication"
    authors: ["Ben Fisch"]
    type: "conference paper"
    id: "https://doi.org/10.1007/978-3-030-17656-3_12"
    location: "EUROCRYPT 2019, Part II, pages 324-348"
    relationship: "background"
    note: >-
      Provides the stacked depth-robust graph proof-of-space setting and the
      Filecoin-shaped parameters used by the concrete specialization.
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    ProofOfSpaceStatement.latency_chung8_whp is the registered probabilistic
    latency theorem and returns an explicit unpebbled-path event in a static
    red/black pebbling snapshot. The vertical graph is constructed from eight
    uniformly sampled permutations; its expansion is proved with failure at
    most an exact finite union-bound expression. Intra-layer depth robustness
    and pebbling budgets remain in the signature. The rational degree-eight
    profile is certified in its entirety inside the Chung region, at a level
    proportional to H(x), on all of (0,1). No expansion profile is posited in
    the statement: the expansion demanded of a sampled interlayer is the root
    of Reyzin's union-bound exponent E_8(x,.) = -H(x)/2^23, written out in
    Challenge.lean, and the rational polygon appears only in the proof, as the
    under-approximation that discharges the deterministic argument's
    hypothesis. The level is relative rather than fixed because E_8(x,x) =
    -6 H(x): a fixed level empties the region near the endpoints and would cap
    the theorem below deployed layer widths.
    The generic union-bound layer is uniform in width, degree, and expansion
    setting. The formalization does not include the reduction to a time-indexed
    cryptographic game, nor identify Filecoin's Feistel wiring with a uniform
    tuple of permutations.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "ProofOfSpaceStatement.latency_chung8_whp"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []


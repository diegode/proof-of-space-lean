version: "v0.4"

project:
  name: "Formalized latency bounds for stacked proofs of space"
  description: >-
    A Lean 4 uniform-gain latency theorem for stacked depth-robust graphs,
    with exact integer source counting and a finite Chung port-model union bound.
    Under explicit graph and security assumptions, the Filecoin specialization
    gives at least 0.205n path vertices at 18 layers for n at least 10000.
  authors:
    - "Diego de Estrada (@diegode)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Diego de Estrada (@diegode)"

classification:
  arxiv: ["cs.CR"]
  msc2020: ["94A60", "68Q25"]

sources:
  - title: "Proofs of space with maximal hardness"
    authors: ["Leonid Reyzin"]
    type: "conference paper"
    id: "https://dblp.org/rec/conf/focs/Reyzin24"
    location: "65th IEEE Symposium on Foundations of Computer Science, 2024, pages 1159-1177"
    relationship: "adapts"
    note: >-
      Adapts the footprint and expansion framework to path latency using
      ordinary depth robustness, an integer source lemma, and uniform-gain
      affine accounting. The notation pi, alpha_pi, and zeta_delta follows Reyzin.
    author_endorsement: "not-contacted"
  - title: "Tight proofs of space and replication"
    authors: ["Ben Fisch"]
    type: "conference paper"
    id: "https://doi.org/10.1007/978-3-030-17656-3_12"
    location: "EUROCRYPT 2019, Part II, pages 324-348"
    relationship: "background"
    note: >-
      Provides the stacked depth-robust graph proof-of-space setting and the
      Filecoin-shaped parameters used by the concrete specialization.
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    The deterministic pebbling_latency theorem proves ceil(alpha_pi*n)+(z-1)q
    path vertices from interval expansion and ordinary depth robustness.
    The integer source increment is
    q=min(ceil(alpha_pi*n),ceil(alpha_pi*n)+m-ceil(pi*n)-s+1).
    The gain is defined as g=beta(m/n)-delta-m/n and assumed positive and
    minimal throughout the query interval. For zeta-delta at least m/n,
    the layer condition is ell > 1+rho/g+z*(1+(beta(m/n)-beta(s/n))/g).
    The challenge set is S; footprint and source cardinalities are m and s.
    chung8_pebbling_latency_whp lifts this to one uniform permutation of 8n
    ports reused throughout the stack. The event quantifies over all admissible
    graphs, positions, and challenges after the wiring is sampled.
    chung8_pebbling_latency_18 yields 0.205n at the Filecoin pebble fractions
    for n at least 10000, assuming the exact functional Chung failure sum on
    [0.01,0.96] is at most 2^-lambda. This security condition remains explicit;
    n at least 10000 only supplies the finite-width latency estimates.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "ProofOfSpaceStatement.pebbling_latency"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "ProofOfSpaceStatement.chung8_pebbling_latency_whp"
      file: "Solution.lean"
      sorry_count: 0

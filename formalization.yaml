    with Lean 4, and the pinned Palomar Comparator toolchain checks the submitted
    Challenge theorem against Solution.lean, rejects nonstandard axioms and
    sorryAx in its proof, and replays it through NanoDa.

alignment:
  namespace: "ProofOfSpaceStatement"
  statements:
    - source: "Reyzin, Proofs of Space with Maximal Hardness (FOCS 2024), footprint and chain-growth framework"
      lean: "ProofOfSpaceStatement.chung8_pebbling_latency_14"
      module: "Solution"
      status: "adapted and proved"
      note: >-
        Palomar-facing probabilistic Chung-8 latency theorem. It constructs the
        vertical graph from one uniform permutation of all 8n ports, proves the
        simplified expansion-failure bound, and proves the explicit unpebbled path
        event while permitting broken and restarted continuation chains.


# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Formalized latency bounds for stacked proofs of space"
  description: >-
    A Lean 4 formalization of the static latency argument for stacked
    proof-of-space graphs. Under explicit expansion, intra-layer depth
    robustness, pebbling-budget, and scalar hypotheses, every sufficiently
    large red-free challenge footprint contains an unpebbled directed path of
    length Omega(ell*n). Thus the certified non-parallelizable work grows
    linearly with the number of layers. All constants are explicit, and the
    finite-size degree-eight Filecoin-shaped analysis optimizes the leading
    coefficient, certifying it between 0.02135 and 0.02136.
  authors:
    - "Diego de Estrada (@diegode)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Diego de Estrada (@diegode)"

classification:
  arxiv: ["cs.CR"]
  msc2020: ["94A60", "68Q25"]

sources:
  - title: "Proofs of space with maximal hardness"
    authors: ["Leonid Reyzin"]
    type: "conference paper"
    id: "https://dblp.org/rec/conf/focs/Reyzin24"
    location: "65th IEEE Symposium on Foundations of Computer Science, 2024, pages 1159-1177"
    relationship: "adapts"
    note: >-
      The formalization uses Reyzin's footprint recurrence, expansion
      profile, and chain-growth framework. Its theorem permits continuation
      chains to break and restart and supplies a global ledger and path
      witness.
    author_endorsement: "not-contacted"
  - title: "Tight proofs of space and replication"
    authors: ["Ben Fisch"]
    type: "conference paper"
    id: "https://doi.org/10.1007/978-3-030-17656-3_12"
    location: "EUROCRYPT 2019, Part II, pages 324-348"
    relationship: "background"
    note: >-
      Provides the stacked depth-robust graph proof-of-space setting and the
      Filecoin-shaped parameters used by the concrete specialization.
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    ProofOfSpaceStatement.latency_general is the registered conditional
    latency theorem and returns an explicit unpebbled path in a static
    red/black pebbling snapshot. Expansion, intra-layer depth robustness,
    pebbling budgets, and scalar conditions occur in its signature. The Chung
    zero-level threshold is constructed for every real degree d > 2. The
    Filecoin specialization uses a rational degree-eight profile certified in
    its entirety, not only at its vertices, at the finite-size level
    E = -2^-22 on [2^-25, 1 - 2^-23]; its concavity, reversal law, and unique
    maximizer are proved without an analytic typeclass. The interlayer
    expansion claim is proved by the union bound and evaluated unconditionally
    at n = 20, d = 8. The formalization does not include the reduction to a
    time-indexed cryptographic game, nor the identification of Filecoin's
    Feistel wiring with a uniform tuple of permutations.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "ProofOfSpaceStatement.latency_general"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: >-
        Human-directed Lean development using Mathlib, editor feedback, and
        the project's mechanical axiom audit.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
    - method: "agent"
      models: ["OpenAI Codex"]
      framework: "Codex"
      tool_setup: >-
        Used under human direction for Lean editing, elaboration diagnostics,
        Comparator verification, submission metadata, and CI configuration.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based; exact amount not tracked"
        hardware: "hosted agent plus local Lean toolchain"
      prompting_notes: >-
        Human-directed requests for proof auditing, theorem-interface cleanup,
        and Palomar packaging; no transcript is included in the repository.
  spend_usd: "not tracked"
  notes: >-
    The mathematical development is human-directed. Lean, the project axiom
    audit, and Palomar's statement comparator check the submitted code.

fidelity:
  divergences: >-
    The theorem permits continuation chains to break and restart and tracks
    those events in a global ledger. Lean counts depth forward from the
    challenge layer, opposite to Reyzin's level numbering. Challenge.lean
    expands the bundled project structures into primitive Mathlib-level
    hypotheses, and Solution.lean proves the resulting statement from the
    public theorem. The result concerns a static pebbling snapshot and does
    not formalize a time-indexed sequential game.

review:
  status: "self-assessed"
  reviewers:
    - "Diego de Estrada"
  notes: >-
    No independent mathematical review is recorded. The full project builds
    with Lean 4, an environment-level audit rejects nonstandard axioms and
    sorryAx throughout the ProofOfSpace namespace, and Palomar Comparator
    checks the submitted Challenge theorem against Solution.lean.

alignment:
  namespace: "ProofOfSpaceStatement"
  statements:
    - source: "Reyzin, Proofs of Space with Maximal Hardness (FOCS 2024), footprint and chain-growth framework"
      lean: "ProofOfSpaceStatement.latency_general"
      module: "Solution"
      status: "adapted and proved"
      note: >-
        Palomar-facing statement of the general conditional latency theorem.
        It exposes the setting, graph, tracking, and pebbling structures as
        primitive parameters and proves an explicit unpebbled path and length
        bound while permitting broken and restarted continuation chains.

acknowledgements: >-
  Built with Lean and Mathlib. The proof architecture builds on work by Ben
  Fisch and Leonid Reyzin. Thanks to the Palomar Registry maintainers for the
  submission template and Comparator tooling.

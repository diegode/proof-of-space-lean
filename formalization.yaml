# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Formalized latency bounds for stacked proofs of space"
  description: >-
    A Lean 4 formalization of a conditional latency lower bound for stacked
    proof-of-space graphs. Given an expansion profile, uniform intra-layer
    depth robustness, red and black pebbling budgets, and the stated scalar
    hypotheses, the main theorem constructs a nonempty unpebbled directed
    path from the challenge footprint whose explicit length grows with the
    number of layers. The development formalizes and extends the published
    footprint analyses of Fisch (EUROCRYPT 2019) and Reyzin (FOCS 2024). It
    also derives concrete Filecoin-shaped constants and records precisely the
    additional hypotheses required by that specialization.
  authors:
    - "Diego de Estrada (@diegode)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Diego de Estrada (@diegode)"

classification:
  arxiv: ["cs.CR"]
  msc2020: ["94A60", "68Q25"]

sources:
  - title: "Proofs of space with maximal hardness"
    authors: ["Leonid Reyzin"]
    type: "conference paper"
    id: "https://dblp.org/rec/conf/focs/Reyzin24"
    location: "65th IEEE Symposium on Foundations of Computer Science, 2024, pages 1159-1177"
    relationship: "adapts"
    note: >-
      The formalization uses Reyzin's footprint recurrence, expansion
      profile, and chain-growth framework. It adapts the analysis to permit
      continuation chains to break and restart, with an explicit global
      ledger and path witness.
    author_endorsement: "not-contacted"
  - title: "Tight proofs of space and replication"
    authors: ["Ben Fisch"]
    type: "conference paper"
    id: "https://doi.org/10.1007/978-3-030-17656-3_12"
    location: "EUROCRYPT 2019, Part II, pages 324-348"
    relationship: "background"
    note: >-
      Provides the stacked depth-robust graph proof-of-space setting and the
      Filecoin-shaped parameters used by the concrete specialization.
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    The compared result is the full general conditional latency theorem
    ProofOfSpaceStatement.latency_general and its explicit path witness. The
    formalization proves the footprint recurrence, search, continuation,
    growth, ledger, and latency argument for a static red/black pebbling
    snapshot. Expansion and intra-layer depth robustness are hypotheses of the
    theorem, not constructed universally. The concrete Chung-8/Filecoin
    specialization separately assumes concavity and a unique gain maximizer,
    and its deployed graph certificate remains conditional. No reduction from
    the static snapshot statement to a time-indexed cryptographic sequential-
    time game is claimed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "ProofOfSpaceStatement.latency_general"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: >-
        Human-directed Lean development using Mathlib, editor feedback, and
        the project's mechanical axiom audit.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
    - method: "agent"
      models: ["OpenAI Codex"]
      framework: "Codex"
      tool_setup: >-
        Used under human direction to prepare the Palomar Challenge/Solution
        wrapper, diagnose elaboration errors, run the official Comparator,
        and package submission metadata and CI.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based; exact amount not tracked"
        hardware: "hosted agent plus local Lean toolchain"
      prompting_notes: >-
        Iterative requests to audit the existing development and prepare an
        honest Palomar submission following the public template and Sendov
        example; a complete transcript was not archived in the repository.
  spend_usd: "not tracked"
  notes: >-
    The mathematical development was human-directed. Exact historical effort
    and any automation used before the Palomar packaging pass were not
    reconstructed; all submitted Lean code is checked by Lean, the axiom
    audit, and Palomar's statement comparator.

fidelity:
  divergences: >-
    Relative to Reyzin's published FOCS 2024 analysis, the main theorem allows
    continuation chains to break and restart and tracks those events in a
    single global ledger. Lean counts depth forward from the challenge layer,
    opposite to the published level numbering; README.md explains the
    translation. The submitted Challenge expands the project's bundled
    structures into primitive Mathlib-level hypotheses so that the statement
    is small and independently comparable; Solution.lean proves that this is
    exactly the public Lean theorem. The result concerns a static pebbling
    snapshot and does not itself formalize a time-indexed sequential game.

review:
  status: "self-assessed"
  reviewers:
    - "Diego de Estrada"
  notes: >-
    No independent mathematical review is recorded. The full project builds
    with Lean 4, an environment-level audit rejects nonstandard axioms and
    sorryAx throughout the ProofOfSpace namespace, and Palomar Comparator
    checks the submitted Challenge theorem against Solution.lean.

alignment:
  namespace: "ProofOfSpaceStatement"
  statements:
    - source: "Reyzin, Proofs of Space with Maximal Hardness (FOCS 2024), footprint and chain-growth framework"
      lean: "ProofOfSpaceStatement.latency_general"
      module: "Solution"
      status: "adapted and proved"
      note: >-
        Palomar-facing statement of the general conditional latency theorem.
        It exposes the setting, graph, tracking, and pebbling structures as
        primitive parameters and proves an explicit unpebbled path and length
        bound while permitting broken and restarted continuation chains.

acknowledgements: >-
  Built with Lean and Mathlib. The proof architecture builds on work by Ben
  Fisch and Leonid Reyzin. Thanks to the Palomar Registry maintainers for the
  submission template and Comparator tooling.

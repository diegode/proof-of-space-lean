version: "v0.4"

project:
  name: "Formalized latency bounds for stacked proofs of space"
  description: >-
    A Lean 4 formalization of the static latency argument for stacked
    proof-of-space graphs. A degree-eight Chung interlayer is sampled as one
    uniform permutation of all 8n ports and reused throughout the stack. Under explicit
    intra-layer depth robustness and pebbling-budget hypotheses, every
    sufficiently large red-free challenge footprint contains, with an exact
    quantified failure bound, an unpebbled directed path of length
    Omega(ell*n). All constants are explicit, and the finite-size
    Filecoin-shaped analysis proves Reyzin's simplified expansion-failure
    bound, including its finite-size and security-parameter conditions.
  authors:
    - "Diego de Estrada (@diegode)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Diego de Estrada (@diegode)"

classification:
  arxiv: ["cs.CR"]
  msc2020: ["94A60", "68Q25"]

sources:
  - title: "Proofs of space with maximal hardness"
    authors: ["Leonid Reyzin"]
    type: "conference paper"
    id: "https://dblp.org/rec/conf/focs/Reyzin24"
    location: "65th IEEE Symposium on Foundations of Computer Science, 2024, pages 1159-1177"
    relationship: "adapts"
    note: >-
      The formalization uses Reyzin's footprint recurrence, expansion
      profile, and chain-growth framework. Its theorem permits continuation
      chains to break and restart and supplies a global ledger and path
      witness.
    author_endorsement: "not-contacted"
  - title: "Tight proofs of space and replication"
    authors: ["Ben Fisch"]
    type: "conference paper"
    id: "https://doi.org/10.1007/978-3-030-17656-3_12"
    location: "EUROCRYPT 2019, Part II, pages 324-348"
    relationship: "background"
    note: >-
      Provides the stacked depth-robust graph proof-of-space setting and the
      Filecoin-shaped parameters used by the concrete specialization.
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    ProofOfSpaceStatement.chung8_pebbling_latency_mixed is the generic latency theorem: it
    reads the depth-robustness threshold at the game's own pi and spends the slack up to the
    profile's fertility threshold on j full-length source nodes, so a completed chain link is
    worth (alpha_pi - sigma) n + j. ProofOfSpaceStatement.chung8_pebbling_latency_whp is its
    j = 0 case and is likewise generic in
    the expander: it quantifies over an expansion profile (a concave, strictly increasing,
    reversal-symmetric expansion function under the degree-eight Chung threshold) and a
    certified level budget for it, with all game parameters, the source weight, the link
    count and the layer count symbolic and related only by the budget's level condition
    searchCost(zeta - delta) + (z-1)*linkCost + chargeRate*rho < ell.
    ProofOfSpaceStatement.chung8_pebbling_latency_14 is the registered probabilistic
    latency theorem, the point (0.2, 0.0378, 0.8, 0.8, 0.9, 0.1184, 2, 14) of it, and
    returns an explicit unpebbled-path event in a static red/black pebbling snapshot. The vertical graph is constructed from one
    uniformly sampled permutation of all 8n Chung ports. Its expansion failure
    is bounded by exp(1/8)/(2*pi*alpha*sqrt(delta_n))*2^(-n*epsilon_chung),
    a simplified exponential union-bound expression. The statement exposes the
    required positivity, grid-rounding, and security condition on n and
    epsilon_chung = 2^-22. The security parameter lambda is a number of bits and the failure probability is 2^-lambda. Its integer failure profile is defined only from
    Reyzin's exponent and the finite-grid margin conditions; the rational polygon
    is used only in the proof. Intra-layer depth robustness and pebbling budgets
    remain explicit. The formalization does not include the reduction to a
    time-indexed cryptographic game, nor identify Filecoin's Feistel wiring
    with a uniform port permutation.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "ProofOfSpaceStatement.chung8_pebbling_latency_mixed"

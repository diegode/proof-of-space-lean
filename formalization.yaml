fidelity:
  divergences: >-
    The theorem concerns path latency in a static pebbling snapshot, using
    ordinary depth robustness and a nondecreasing interval expansion bound.
    Its probability model samples one uniform permutation of all 8n ports and
    reuses it across layers; no equivalence with deployed Feistel wiring is
    asserted. Within-layer depth robustness and the exact finite security
    inequality remain assumptions. No time-indexed cryptographic reduction
    is formalized. Lean depth increases away from the challenge, whereas the
    explanation uses Reyzin's levels decreasing toward the top of the stack.

review:
  status: "self-assessed"
  reviewers:
    - "Diego de Estrada"
  notes: >-
    No independent mathematical review is recorded. The full project builds
    with Lean 4, and the pinned Palomar Comparator toolchain checks the submitted
    Challenge theorem against Solution.lean, rejects nonstandard axioms and
    sorryAx in its proof, and replays it through NanoDa.

alignment:
  namespace: "ProofOfSpaceStatement"
  statements:
    - source: "Reyzin, Proofs of Space with Maximal Hardness (FOCS 2024), footprint and expansion framework"
      lean: "ProofOfSpaceStatement.chung8_pebbling_latency_whp"
      module: "Solution"
      status: "adapted and proved"
      note: >-
        A uniform-gain path latency theorem using exact integer source counts.
        The Chung port-model union bound is uniform over admissible positions
        and challenges chosen after the sampled wiring is known.


fidelity:
  divergences: >-
    The theorem samples a union of eight independent perfect matchings rather
    than Filecoin's Feistel wiring, and reuses one sampled interlayer throughout
    the stack. It permits continuation chains to break and restart and tracks
    those events in a global ledger. Lean counts depth forward from the
    challenge layer, opposite to Reyzin's level numbering. The result concerns
    a static pebbling snapshot and does not formalize a time-indexed sequential
    game. Reyzin's deployed-scale numerical failure estimate is not imported;
    the theorem exposes the formal exact finite union bound.

review:
  status: "self-assessed"
  reviewers:
    - "Diego de Estrada"
  notes: >-
    No independent mathematical review is recorded. The full project builds
    with Lean 4, and the pinned Palomar Comparator toolchain checks the submitted
    Challenge theorem against Solution.lean, rejects nonstandard axioms and
    sorryAx in its proof, and replays it through NanoDa.

alignment:
  namespace: "ProofOfSpaceStatement"
  statements:
    - source: "Reyzin, Proofs of Space with Maximal Hardness (FOCS 2024), footprint and chain-growth framework"
      lean: "ProofOfSpaceStatement.latency_chung8_whp"
      module: "Solution"
      status: "adapted and proved"
      note: >-
        Palomar-facing probabilistic Chung-8 latency theorem. It constructs the
        vertical graph from a uniform eight-tuple of permutations, proves an
        exact expansion failure bound, and proves the explicit unpebbled path
        event while permitting broken and restarted continuation chains.

acknowledgements: >-
  Built with Lean and Mathlib. The proof architecture builds on work by Ben
  Fisch and Leonid Reyzin. Thanks to the Palomar Registry maintainers for the
  submission template and Comparator tooling.

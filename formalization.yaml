fidelity:
  divergences: >-
    The theorem samples one uniform permutation of all eight ports per vertex rather
    than Filecoin's Feistel wiring, and reuses one sampled interlayer throughout
    the stack. It permits continuation chains to break and restart and tracks
    those events in a global ledger. Lean counts depth forward from the
    challenge layer, opposite to Reyzin's level numbering. The result concerns
    a static pebbling snapshot and does not formalize a time-indexed sequential
    game. Reyzin's deployed-scale numerical failure estimate is not imported;
    the theorem proves the simplified expansion-failure bound and its displayed
    sufficient width condition.


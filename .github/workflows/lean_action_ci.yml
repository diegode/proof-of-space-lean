name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true

      - name: Trust audit
        run: lake env lean scripts/AxiomAudit.lean

      - name: Palomar source limits
        run: |
          test "$(wc -l < Challenge.lean)" -le 1000
          test "$(wc -c < Challenge.lean)" -le 102400
          test "$(grep -R -n -E '\b(sorry|admit|native_decide)\b' --include='*.lean' . \
            | grep -v '^./Challenge.lean:' \
            | grep -v '^./.lake/' \
            | wc -l)" -eq 0

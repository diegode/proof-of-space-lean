name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        project: [drsample, pebbling_latency]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: ${{ matrix.project }}
          use-github-cache: false
          build: true

      - name: Check public statement surface
        run: python3 scripts/check-statement-surface.py "${{ matrix.project }}"

  comparator:
    name: Check statement against solution
    strategy:
      matrix:
        project: [drsample, pebbling_latency]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: ${{ matrix.project }}
          use-github-cache: false
          build: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.0"
          cache: false

      - name: Run pinned Comparator toolchain
        run: ./scripts/verify-comparator.sh "${{ matrix.project }}"

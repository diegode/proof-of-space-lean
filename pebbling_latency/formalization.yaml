version: "v0.4"

project:
  name: "Formalized latency bounds for stacked proofs of space"
  description: >-
    A Lean 4 reference-trajectory latency theorem for stacked depth-robust graphs,
    with concave expansion, explicit repair accounting, exact integer source
    counting, and a finite Chung port-model union bound.
    Under explicit graph and security assumptions, the Filecoin specialization
    gives at least 0.205n path vertices at 17 layers for n at least 10000.
  authors:
    - "Diego de Estrada (@diegode)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Diego de Estrada (@diegode)"

classification:
  arxiv: ["cs.CR"]
  msc2020: ["94A60", "68Q25"]

sources:
  - title: "Proofs of space with maximal hardness"
    authors: ["Leonid Reyzin"]
    type: "paper"
    id: "https://dblp.org/rec/conf/focs/Reyzin24"
    location: "65th IEEE Symposium on Foundations of Computer Science, 2024, pages 1159-1177"
    relationship: "adapts"
    note: >-
      Adapts the footprint and expansion framework to path latency using
      ordinary depth robustness, an integer source lemma, interpolated free
      trajectories, and explicit finite budget accounting. The notation pi,
      alpha_pi, and zeta_delta follows Reyzin.
    author_endorsement: "not-contacted"
  - title: "Tight proofs of space and replication"
    authors: ["Ben Fisch"]
    type: "paper"
    id: "https://doi.org/10.1007/978-3-030-17656-3_12"
    location: "EUROCRYPT 2019, Part II, pages 324-348"
    relationship: "background"
    note: >-
      Provides the stacked depth-robust graph proof-of-space setting and the
      Filecoin-shaped parameters used by the concrete specialization.
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    The single registered statement is pebbling_latency. It proves
    ceil(alpha_pi*n)+(z-1)q path vertices from concave interval expansion and
    ordinary depth robustness, where
    q=min(ceil(alpha_pi*n),ceil(alpha_pi*n)+m+1-(ceil(pi*n)+s)).
    Let p=m/n, sigma=s/n, F=beta-delta, g=F(p)-p, and kappa=F(sigma)-a,
    with positive band floor a. The scale tau interpolates the free trajectory
    from a through its first crossing of p. Set D=tau(p)-tau(sigma) and
    D0=tau(p)-tau(min(p,zeta-delta)). The sufficient layer bound is
    ell > 1+D0+(z-1)*(1+D)+rho/g+max(0,(rho-kappa)/g+2).
    Assumptions include monotonicity and concavity on [a,p], positive g,
    gain at a at least g, gain at sigma at least 2g, and
    rho+a at most min(zeta-delta,F(p)).
    chung8_reference_latency_whp lifts this result to one uniform permutation
    of 8n ports reused throughout the stack, uniformly over admissible graphs,
    positions, and challenges chosen after sampling.
    chung8_reference_latency_17 instantiates this theorem with
    a=0.05089, m=ceil(0.8n), s=ceil(0.195n), z=2, and free crossing time 4.
    It yields at least 0.205n path vertices at 17 layers for every n at least
    10000, under the explicit depth-robustness and functional Chung failure-sum
    assumption on [0.01,0.96]. Its proof includes exact rational trajectory
    evaluation and finite-width vertex rounding. Seventeen is a sufficient
    layer count; no matching necessity result is asserted.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "ProofOfSpaceStatement.pebbling_latency"
